#user  nobody;
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    use epoll;
    worker_connections  65535;
    multi_accept off;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile       on;
    tcp_nopush     on;
    access_log     off;
    keepalive_timeout 65;

    gzip             on;
    gzip_min_length  2k;
    gzip_buffers     4 32k;
    gzip_http_version 1.1;
    gzip_comp_level  6;
    gzip_types       text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml image/png image/gif image/jpeg image/webp image/apng application/octet-stream;
    gzip_vary        on;
    gzip_proxied     any;

    proxy_cache_path /home/data/cache levels=1:2 keys_zone=web3d:100m max_size=50g inactive=30s use_temp_path=off;

    upstream backend_servers {
        # 默认使用轮询 (round-robin) 算法
        # ip_hash;  # 如果需要会话保持(让同一用户的请求固定到一台服务器)，取消此行注释
        
        server 10.189.91.1:5000;
        server 10.189.91.2:5000; # 添加您的第二台后端服务器
    }
    server {
        listen       8000;
        server_name  10.189.91.1;

        root   /home/frontend;
        index  index.html index.htm;

        # API 接口代理
        location /prod-api/ {
            proxy_pass         http://backend_servers/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # 前端静态文件及 SPA 路由
        location / {
            try_files $uri $uri/ @fallback;
        }

        location @fallback {
            rewrite ^ /index.html break;
        }
	
	# 禁用静态资源缓存（关键修改）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # SQLBot 反向代理配置 (使用 ^~ 确保优先匹配，不被 try_files 拦截)
        location ^~ /sqlbot/ {
            proxy_pass http://10.189.91.5:18000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket 支持 (SQLBot 对话需要)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 超时设置 (AI 对话可能较慢)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

    }
}
